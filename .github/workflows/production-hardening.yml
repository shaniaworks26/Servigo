name: Production Hardening CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:
    inputs:
      run_open_handle_fallback:
        description: "Run manual fallback open-handle diagnostic with force-exit"
        required: false
        default: false
        type: boolean

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: servigo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d servigo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5005
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/servigo
      PGSSLMODE: disable
      JWT_SECRET: test_access_secret_please_change
      JWT_REFRESH_SECRET: test_refresh_secret_please_change
      JWT_EMAIL_SECRET: test_email_secret_please_change
      JWT_EXPIRE: 7d
      JWT_REFRESH_EXPIRE: 30d
      EMAIL_VERIFICATION_EXPIRE: 1d
      CORS_ORIGIN: http://127.0.0.1:4173
      FRONTEND_URL: http://127.0.0.1:4173
      ENFORCE_HTTPS: false
      PASSWORD_RESET_DELIVERY_MODE: log
      CI_ADMIN_EMAIL: admin@servigo.local
      CI_ADMIN_PASSWORD: Admin1234!
      SECRET_PROVIDER: env
      SECRET_MANAGER_ENABLED: false
      SECRET_MAPPING_JSON: '{}'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint production code (fail on warning)
        run: npm run lint:prod

      - name: Lint legacy and experimental code (warnings allowed)
        continue-on-error: true
        run: npm run lint:legacy

      - name: TypeScript check
        run: npm run typecheck

      - name: Monitoring configuration validation
        run: npm run monitoring:validate

      - name: Unit and integration tests
        run: npm test

      - name: Open handle smoke check
        run: |
          set -o pipefail
          npm run test:open-handles:smoke 2>&1 | tee open-handles-smoke.log

      - name: Upload open-handle smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-handles-smoke-log
          path: open-handles-smoke.log

      - name: Build frontend
        run: npm run build

      - name: Install Chromium for a11y checks
        run: npx playwright install --with-deps chromium

      - name: Frontend smoke (Playwright with backend)
        run: npm run test:frontend:smoke:ci

      - name: Frontend a11y and responsive (Playwright with backend)
        run: npm run test:frontend:a11y:ci

      - name: Accessibility audit (axe)
        run: npm run test:a11y

      - name: Lighthouse performance and budgets
        run: npm run test:lighthouse

      - name: API regression (Newman)
        run: npm run test:api:newman

      - name: Upload Newman report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          if-no-files-found: ignore
          path: |
            newman/newman-junit.xml
            newman/newman-report.html

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          if-no-files-found: ignore
          path: .lighthouseci/*

  open-handles-fallback-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.run_open_handle_fallback == true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: servigo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d servigo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5005
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/servigo
      PGSSLMODE: disable
      JWT_SECRET: test_access_secret_please_change
      JWT_REFRESH_SECRET: test_refresh_secret_please_change
      JWT_EMAIL_SECRET: test_email_secret_please_change
      JWT_EXPIRE: 7d
      JWT_REFRESH_EXPIRE: 30d
      EMAIL_VERIFICATION_EXPIRE: 1d
      CORS_ORIGIN: http://127.0.0.1:4173
      FRONTEND_URL: http://127.0.0.1:4173
      ENFORCE_HTTPS: false
      PASSWORD_RESET_DELIVERY_MODE: log
      CI_ADMIN_EMAIL: admin@servigo.local
      CI_ADMIN_PASSWORD: Admin1234!
      SECRET_PROVIDER: env
      SECRET_MANAGER_ENABLED: false
      SECRET_MAPPING_JSON: '{}'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Open handle fallback diagnostic (force-exit)
        run: |
          set -o pipefail
          npm run test:open-handles:smoke:force-exit 2>&1 | tee open-handles-force-exit.log

      - name: Upload fallback open-handle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-handles-force-exit-log
          path: open-handles-force-exit.log
